<svg xmlns="http://www.w3.org/2000/svg" data-layout="process" width="1060" height="1495" viewBox="0 0 1060 1495" role="img" aria-labelledby="diagram-title diagram-desc" font-family="Segoe UI, Microsoft YaHei, system-ui, sans-serif"><title id="diagram-title">教学合成示例：五个抽象概念，怎样读得懂？</title><desc id="diagram-desc">教学合成示例 · 非真实论文结论。箭头表达输入中的关系，不自动表示因果；结构可呈现不等于科学结论已验证。单链关系适合横向阅读；箭头遵循原始输入，不额外推断时间。符号不代表真实几何。</desc><defs><linearGradient id="node-surface" x2="0" y2="1"><stop stop-color="#192435"/><stop offset="1" stop-color="#101925"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#304057" opacity=".55"/></pattern><marker id="arrow-0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#66d9cf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#82b4ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#0a101a"/><rect width="100%" height="411" fill="url(#grid)"/><text x="42" y="40" fill="#66d9cf" font-size="11" letter-spacing="3">SCIVIZ / PROCESS ATLAS</text><text x="42" y="80" font-size="23" fill="#eff4fc">教学合成示例：五个抽象概念，怎样读得懂？</text><text x="42" y="112" font-size="12" fill="#9cacc0">方法流程 · 沿箭头阅读输入关系 · 符号不代表真实几何</text><g transform="translate(0 0)"><g class="flow-edge" data-edge="0" data-from="0" data-to="1" style="--edge-color:#66d9cf"><title>明确问题 → 建立教学示意：选择与问题对应的模型</title><g fill="none" stroke="#66d9cf" stroke-width="2.3"><path d="M 280 254 H 398"/><path d="M 386 254 H 400" marker-end="url(#arrow-0)"/></g><rect class="edge-label" x="289" y="277" width="112" height="70" rx="8" fill="#0c131e" stroke="#66d9cf" stroke-opacity=".3"/><text x="345" y="295" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#66d9cf">E1</text><text x="345" y="316" text-anchor="middle" font-size="14" fill="#dbe6f3" xml:space="preserve">选择与问题对</text><text x="345" y="336" text-anchor="middle" font-size="14" fill="#dbe6f3" xml:space="preserve">应的模型</text></g><g class="flow-edge" data-edge="1" data-from="1" data-to="2" style="--edge-color:#82b4ff"><title>建立教学示意 → 检查模型边界：解释之前核对适用范围</title><g fill="none" stroke="#82b4ff" stroke-width="2.3"><path d="M 650 254 H 768"/><path d="M 756 254 H 770" marker-end="url(#arrow-1)"/></g><rect class="edge-label" x="659" y="277" width="112" height="70" rx="8" fill="#0c131e" stroke="#82b4ff" stroke-opacity=".3"/><text x="715" y="295" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#82b4ff">E2</text><text x="715" y="316" text-anchor="middle" font-size="14" fill="#dbe6f3" xml:space="preserve">解释之前核对</text><text x="715" y="336" text-anchor="middle" font-size="14" fill="#dbe6f3" xml:space="preserve">适用范围</text></g><g class="flow-node" style="--node-color:#66d9cf" aria-label="1. 明确问题"><title>先说明要理解的概念和已经阅读的范围。</title><rect class="node-halo" x="35" y="175" width="250" height="174" rx="17" fill="none" stroke="#66d9cf" stroke-opacity=".1"/><rect class="node-surface" x="40" y="180" width="240" height="164" rx="12" fill="url(#node-surface)" stroke="#66d9cf" stroke-opacity=".55"/><circle cx="68" cy="209" r="13" fill="#66d9cf" fill-opacity=".1" stroke="#66d9cf" stroke-opacity=".6"/><text x="68" y="213" text-anchor="middle" font-size="10" fill="#66d9cf">01</text><text x="258" y="214" text-anchor="end" font-size="10" letter-spacing="1" fill="#a0b0c4"></text><g class="role-glyph" transform="translate(160 244)" fill="none" stroke="#66d9cf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle r="43" fill="#66d9cf" fill-opacity=".04" stroke-opacity=".17"/><circle r="22"/><path d="M-31 0H31M0-31V31"/><circle r="5"/></g><text x="160" y="310" text-anchor="middle" font-size="19" font-weight="550" fill="#f0f5fb" xml:space="preserve">明确问题</text><line x1="136" x2="184" y1="328" y2="328" stroke="#66d9cf" stroke-opacity=".6"/></g><g class="flow-node" style="--node-color:#82b4ff" aria-label="2. 建立教学示意"><title>依据定义选择有限、可解释的示意图；同时给出通俗与严谨的文字。</title><rect class="node-halo" x="405" y="175" width="250" height="174" rx="17" fill="none" stroke="#82b4ff" stroke-opacity=".1"/><rect class="node-surface" x="410" y="180" width="240" height="164" rx="12" fill="url(#node-surface)" stroke="#82b4ff" stroke-opacity=".55"/><circle cx="438" cy="209" r="13" fill="#82b4ff" fill-opacity=".1" stroke="#82b4ff" stroke-opacity=".6"/><text x="438" y="213" text-anchor="middle" font-size="10" fill="#82b4ff">02</text><text x="628" y="214" text-anchor="end" font-size="10" letter-spacing="1" fill="#a0b0c4"></text><g class="role-glyph" transform="translate(530 244)" fill="none" stroke="#82b4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle r="43" fill="#82b4ff" fill-opacity=".04" stroke-opacity=".17"/><circle r="22"/><path d="M-31 0H31M0-31V31"/><circle r="5"/></g><text x="530" y="310" text-anchor="middle" font-size="19" font-weight="550" fill="#f0f5fb" xml:space="preserve">建立教学示意</text><line x1="506" x2="554" y1="328" y2="328" stroke="#82b4ff" stroke-opacity=".6"/></g><g class="flow-node" style="--node-color:#c2a2f5" aria-label="3. 检查模型边界"><title>核对来源、条件与类比失效的位置，不能把示意图当成实测或结构预测。</title><rect class="node-halo" x="775" y="175" width="250" height="174" rx="17" fill="none" stroke="#c2a2f5" stroke-opacity=".1"/><rect class="node-surface" x="780" y="180" width="240" height="164" rx="12" fill="url(#node-surface)" stroke="#c2a2f5" stroke-opacity=".55"/><circle cx="808" cy="209" r="13" fill="#c2a2f5" fill-opacity=".1" stroke="#c2a2f5" stroke-opacity=".6"/><text x="808" y="213" text-anchor="middle" font-size="10" fill="#c2a2f5">03</text><text x="998" y="214" text-anchor="end" font-size="10" letter-spacing="1" fill="#a0b0c4"></text><g class="role-glyph" transform="translate(900 244)" fill="none" stroke="#c2a2f5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle r="43" fill="#c2a2f5" fill-opacity=".04" stroke-opacity=".17"/><circle r="22"/><path d="M-31 0H31M0-31V31"/><circle r="5"/></g><text x="900" y="310" text-anchor="middle" font-size="19" font-weight="550" fill="#f0f5fb" xml:space="preserve">检查模型边界</text><line x1="876" x2="924" y1="328" y2="328" stroke="#c2a2f5" stroke-opacity=".6"/></g></g><line x1="42" y1="429" x2="1018" y2="429" stroke="#2a3a4e"/><text x="42" y="451" font-size="14" fill="#b7c6d9" xml:space="preserve">阅读注解 / 节点与来源</text><text x="42" y="475" font-size="14" fill="#b7c6d9" xml:space="preserve">01  明确问题</text><text x="42" y="499" font-size="14" fill="#b7c6d9" xml:space="preserve">先说明要理解的概念和已经阅读的范围。</text><text x="42" y="523" font-size="14" fill="#b7c6d9" xml:space="preserve">来源：original_1</text><text x="42" y="547" font-size="14" fill="#b7c6d9" xml:space="preserve"></text><text x="42" y="571" font-size="14" fill="#b7c6d9" xml:space="preserve">02  建立教学示意</text><text x="42" y="595" font-size="14" fill="#b7c6d9" xml:space="preserve">依据定义选择有限、可解释的示意图；同时给出通俗与严谨的文字。</text><text x="42" y="619" font-size="14" fill="#b7c6d9" xml:space="preserve">来源：original_1</text><text x="42" y="643" font-size="14" fill="#b7c6d9" xml:space="preserve"></text><text x="42" y="667" font-size="14" fill="#b7c6d9" xml:space="preserve">03  检查模型边界</text><text x="42" y="691" font-size="14" fill="#b7c6d9" xml:space="preserve">核对来源、条件与类比失效的位置，不能把示意图当成实测或结构预测。</text><text x="42" y="715" font-size="14" fill="#b7c6d9" xml:space="preserve">来源：original_1</text><text x="42" y="739" font-size="14" fill="#b7c6d9" xml:space="preserve"></text><text x="42" y="763" font-size="14" fill="#b7c6d9" xml:space="preserve">完整关系 / 与图中 E 编号对应</text><text x="42" y="787" font-size="14" fill="#b7c6d9" xml:space="preserve">E1  明确问题 → 建立教学示意</text><text x="42" y="811" font-size="14" fill="#b7c6d9" xml:space="preserve">选择与问题对应的模型</text><text x="42" y="835" font-size="14" fill="#b7c6d9" xml:space="preserve">来源：original_1</text><text x="42" y="859" font-size="14" fill="#b7c6d9" xml:space="preserve"></text><text x="42" y="883" font-size="14" fill="#b7c6d9" xml:space="preserve">E2  建立教学示意 → 检查模型边界</text><text x="42" y="907" font-size="14" fill="#b7c6d9" xml:space="preserve">解释之前核对适用范围</text><text x="42" y="931" font-size="14" fill="#b7c6d9" xml:space="preserve">来源：original_1</text><text x="42" y="955" font-size="14" fill="#b7c6d9" xml:space="preserve"></text><text x="42" y="979" font-size="14" fill="#b7c6d9" xml:space="preserve">来源说明</text><text x="42" y="1003" font-size="14" fill="#b7c6d9" xml:space="preserve">[original_1] 团队原创教学夹具：抽象概念入门</text><text x="42" y="1027" font-size="14" fill="#b7c6d9" xml:space="preserve">位置：完整教学说明，非论文</text><text x="42" y="1051" font-size="14" fill="#b7c6d9" xml:space="preserve">理解抽象知识时，先确定问题，再建立受限的示意模型，最后检查类比的适用边界。拓扑研究连续变形下保持的性质，闭合曲线拉长可</text><text x="42" y="1075" font-size="14" fill="#b7c6d9" xml:space="preserve">以保持连通。Sierpiński三角形每步保留三个二分之一尺度副本，理想相似维数是log(3)/log(2)。一维无量纲高斯波包可写为ψ(ξ)</text><text x="42" y="1099" font-size="14" fill="#b7c6d9" xml:space="preserve">=π^(-1/4)exp(-ξ²/2)exp(i3ξ)，概率密度是|ψ|²，而非轨迹。简谐运动满足x=Acos(ωt)以及a=-ω²x，理想模型忽略阻尼和外力</text><text x="42" y="1123" font-size="14" fill="#b7c6d9" xml:space="preserve">。蛋白质一级结构是氨基酸序列，二级结构描述局部构象，三级结构描述整体折叠。简单概念图不能预测真实蛋白质原子坐标。这些是</text><text x="42" y="1147" font-size="14" fill="#b7c6d9" xml:space="preserve">教学说明，不是一次论文实验的发现。</text><text x="42" y="1171" font-size="14" fill="#b7c6d9" xml:space="preserve"></text><text x="42" y="1195" font-size="14" fill="#b7c6d9" xml:space="preserve">来源核对：待核对（不影响生成）</text><text x="42" y="1219" font-size="14" fill="#b7c6d9" xml:space="preserve"></text><text x="42" y="1243" font-size="14" fill="#b7c6d9" xml:space="preserve">箭头表达输入中的关系，不自动表示因果；结构可呈现不等于科学结论已验证。</text><text x="42" y="1267" font-size="14" fill="#b7c6d9" xml:space="preserve">本页为教学合成示例，未执行联网检索，不代表真实论文分析或科研结论。</text><text x="42" y="1291" font-size="14" fill="#b7c6d9" xml:space="preserve">配图使用明确的教学模板；不生成任意专业插画、真实分子模型或三维重建。</text><text x="42" y="1315" font-size="14" fill="#b7c6d9" xml:space="preserve">来源核对为生成后的可选步骤。未核对资料可以生成示意图；生成不代表科学主张已被验证，关键结论请对照原文核查。</text><text x="42" y="1339" font-size="14" fill="#b7c6d9" xml:space="preserve">本图只表达输入中的节点与关系；未进行自动论文解析、科学模拟或科学真实性验证。</text><text x="42" y="1363" font-size="14" fill="#b7c6d9" xml:space="preserve"></text><text x="42" y="1387" font-size="14" fill="#b7c6d9" xml:space="preserve">版权与使用说明：本页根据输入资料自动生成。论文、图表、摘录及其他第三方材料的权利归原权利人所有；生成结果可能涉及复制、</text><text x="42" y="1411" font-size="14" fill="#b7c6d9" xml:space="preserve">改编或传播等版权风险。生成不表示已获授权，本声明也不替代授权或自动免除责任。公开展示、发布或商业使用前，请核对原始许可</text><text x="42" y="1435" font-size="14" fill="#b7c6d9" xml:space="preserve">、合理使用条件及署名要求；必要时取得授权。</text></svg>