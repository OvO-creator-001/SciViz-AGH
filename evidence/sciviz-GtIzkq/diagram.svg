<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1234" viewBox="0 0 760 1234" role="img" aria-labelledby="diagram-title diagram-desc" font-family="system-ui, sans-serif"><title id="diagram-title">教学夹具：样本处理流程（非真实论文）</title><desc id="diagram-desc">依据输入制作的流程示意 · 科学含义需人工核对。评估仅表示输入满足既定规则，不表示科学正确性已验证。节点按输入顺序纵向排列，E 编号对应连接关系。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#70869b"/></marker></defs><rect width="760" height="1234" fill="#f3f7fa"/><text x="32" y="32" font-size="14" fill="#315b77">依据输入制作的流程示意 · 科学含义需人工核对</text><text x="32" y="66" font-size="20" fill="#142e44">教学夹具：样本处理流程（非真实论文）</text><text x="32" y="116" font-size="13" fill="#40566b">节点顺序来自输入；箭头只表示输入中的关系。</text><text x="32" y="136" font-size="12" fill="#40566b">评估仅表示输入满足既定规则，不表示科学正确性已验证。</text><g><title>E1: n1 → n2：随后；来源 s1</title><path d="M 260 260 V 322" fill="none" stroke="#70869b" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="300" font-size="13" fill="#40566b">E1</text></g><g><title>E2: n2 → n3：随后；来源 s1</title><path d="M 260 418 V 480" fill="none" stroke="#70869b" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="458" font-size="13" fill="#40566b">E2</text></g><g class="flow-node" aria-label="1. 登记"><title>记录样本标识。</title><rect x="70" y="172" width="380" height="88" rx="14" fill="#ffffff" stroke="#526e88" stroke-width="2"/><text x="90" y="197" font-size="12" fill="#516e87">01</text><text x="260" y="224" text-anchor="middle" font-size="18" fill="#132d45"><tspan x="260" dy="0">登记</tspan></text></g><g class="flow-node" aria-label="2. 测量"><title>记录测量值。</title><rect x="70" y="330" width="380" height="88" rx="14" fill="#ffffff" stroke="#526e88" stroke-width="2"/><text x="90" y="355" font-size="12" fill="#516e87">02</text><text x="260" y="382" text-anchor="middle" font-size="18" fill="#132d45"><tspan x="260" dy="0">测量</tspan></text></g><g class="flow-node" aria-label="3. 汇总"><title>整理结果。</title><rect x="70" y="488" width="380" height="88" rx="14" fill="#ffffff" stroke="#526e88" stroke-width="2"/><text x="90" y="513" font-size="12" fill="#516e87">03</text><text x="260" y="540" text-anchor="middle" font-size="18" fill="#132d45"><tspan x="260" dy="0">汇总</tspan></text></g><text x="32" y="666" font-size="14" fill="#20394e" xml:space="preserve">节点解释与来源</text><text x="32" y="688" font-size="14" fill="#20394e" xml:space="preserve">1. 登记</text><text x="32" y="710" font-size="14" fill="#20394e" xml:space="preserve">记录样本标识。</text><text x="32" y="732" font-size="14" fill="#20394e" xml:space="preserve">来源：s1</text><text x="32" y="754" font-size="14" fill="#20394e" xml:space="preserve">2. 测量</text><text x="32" y="776" font-size="14" fill="#20394e" xml:space="preserve">记录测量值。</text><text x="32" y="798" font-size="14" fill="#20394e" xml:space="preserve">来源：s1</text><text x="32" y="820" font-size="14" fill="#20394e" xml:space="preserve">3. 汇总</text><text x="32" y="842" font-size="14" fill="#20394e" xml:space="preserve">整理结果。</text><text x="32" y="864" font-size="14" fill="#20394e" xml:space="preserve">来源：s1</text><text x="32" y="886" font-size="14" fill="#20394e" xml:space="preserve">连接关系（E 编号对应箭头；不自动表示因果）</text><text x="32" y="908" font-size="14" fill="#20394e" xml:space="preserve">E1. n1 → n2：随后；来源：s1</text><text x="32" y="930" font-size="14" fill="#20394e" xml:space="preserve">E2. n2 → n3：随后；来源：s1</text><text x="32" y="952" font-size="14" fill="#20394e" xml:space="preserve">来源说明</text><text x="32" y="974" font-size="14" fill="#20394e" xml:space="preserve">[s1] SciViz团队合成教学夹具，不代表研究结果</text><text x="32" y="996" font-size="14" fill="#20394e" xml:space="preserve">位置：fixture paragraph 1</text><text x="32" y="1018" font-size="14" fill="#20394e" xml:space="preserve">摘录：样本先登记，再测量，最后汇总。</text><text x="32" y="1040" font-size="14" fill="#20394e" xml:space="preserve"></text><text x="32" y="1062" font-size="14" fill="#20394e" xml:space="preserve">人工确认：提交者标记为已核对</text><text x="32" y="1084" font-size="14" fill="#20394e" xml:space="preserve">限制</text><text x="32" y="1106" font-size="14" fill="#20394e" xml:space="preserve">评估仅表示输入满足既定规则，不表示科学正确性已验证。</text><text x="32" y="1128" font-size="14" fill="#20394e" xml:space="preserve">Rule-based structural checks only; source verification is a human attestation, not a</text><text x="32" y="1150" font-size="14" fill="#20394e" xml:space="preserve">utomatic scientific validation.</text><text x="32" y="1172" font-size="14" fill="#20394e" xml:space="preserve">No calibrated probability, PDF parsing, paid API, 3D or scientific simulation.</text></svg>