<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1212" viewBox="0 0 760 1212" role="img" aria-labelledby="diagram-title diagram-desc" font-family="system-ui, sans-serif"><title id="diagram-title">教学合成示例：数据处理流程</title><desc id="diagram-desc">教学合成示例 · 非真实论文结论。评估仅表示输入满足既定规则，不表示科学正确性已验证。节点按输入顺序纵向排列，E 编号对应连接关系。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#70869b"/></marker></defs><rect width="760" height="1212" fill="#f3f7fa"/><text x="32" y="32" font-size="14" fill="#315b77">教学合成示例 · 非真实论文结论</text><text x="32" y="66" font-size="20" fill="#142e44">教学合成示例：数据处理流程</text><text x="32" y="116" font-size="13" fill="#40566b">节点顺序来自输入；箭头只表示输入中的关系。</text><text x="32" y="136" font-size="12" fill="#40566b">评估仅表示输入满足既定规则，不表示科学正确性已验证。</text><g><title>E1: n1 → n2：下一步；来源 s1</title><path d="M 260 260 V 322" fill="none" stroke="#70869b" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="300" font-size="13" fill="#40566b">E1</text></g><g><title>E2: n2 → n3：下一步；来源 s1</title><path d="M 260 418 V 480" fill="none" stroke="#70869b" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="458" font-size="13" fill="#40566b">E2</text></g><g class="flow-node" aria-label="1. 输入数据"><title>准备待处理的数据。</title><rect x="70" y="172" width="380" height="88" rx="14" fill="#ffffff" stroke="#526e88" stroke-width="2"/><text x="90" y="197" font-size="12" fill="#516e87">01</text><text x="260" y="224" text-anchor="middle" font-size="18" fill="#132d45"><tspan x="260" dy="0">输入数据</tspan></text></g><g class="flow-node" aria-label="2. 处理数据"><title>按照指定步骤处理。</title><rect x="70" y="330" width="380" height="88" rx="14" fill="#ffffff" stroke="#526e88" stroke-width="2"/><text x="90" y="355" font-size="12" fill="#516e87">02</text><text x="260" y="382" text-anchor="middle" font-size="18" fill="#132d45"><tspan x="260" dy="0">处理数据</tspan></text></g><g class="flow-node" aria-label="3. 查看结果"><title>观察输出并检查限制。</title><rect x="70" y="488" width="380" height="88" rx="14" fill="#ffffff" stroke="#526e88" stroke-width="2"/><text x="90" y="513" font-size="12" fill="#516e87">03</text><text x="260" y="540" text-anchor="middle" font-size="18" fill="#132d45"><tspan x="260" dy="0">查看结果</tspan></text></g><text x="32" y="666" font-size="14" fill="#20394e" xml:space="preserve">节点解释与来源</text><text x="32" y="688" font-size="14" fill="#20394e" xml:space="preserve">1. 输入数据</text><text x="32" y="710" font-size="14" fill="#20394e" xml:space="preserve">准备待处理的数据。</text><text x="32" y="732" font-size="14" fill="#20394e" xml:space="preserve">来源：s1</text><text x="32" y="754" font-size="14" fill="#20394e" xml:space="preserve">2. 处理数据</text><text x="32" y="776" font-size="14" fill="#20394e" xml:space="preserve">按照指定步骤处理。</text><text x="32" y="798" font-size="14" fill="#20394e" xml:space="preserve">来源：s1</text><text x="32" y="820" font-size="14" fill="#20394e" xml:space="preserve">3. 查看结果</text><text x="32" y="842" font-size="14" fill="#20394e" xml:space="preserve">观察输出并检查限制。</text><text x="32" y="864" font-size="14" fill="#20394e" xml:space="preserve">来源：s1</text><text x="32" y="886" font-size="14" fill="#20394e" xml:space="preserve">连接关系（E 编号对应箭头；不自动表示因果）</text><text x="32" y="908" font-size="14" fill="#20394e" xml:space="preserve">E1. n1 → n2：下一步；来源：s1</text><text x="32" y="930" font-size="14" fill="#20394e" xml:space="preserve">E2. n2 → n3：下一步；来源：s1</text><text x="32" y="952" font-size="14" fill="#20394e" xml:space="preserve">来源说明</text><text x="32" y="974" font-size="14" fill="#20394e" xml:space="preserve">[s1] 团队编写的教学样例</text><text x="32" y="996" font-size="14" fill="#20394e" xml:space="preserve">位置：示例说明第1段</text><text x="32" y="1018" font-size="14" fill="#20394e" xml:space="preserve">摘录：准备数据，处理数据，再查看结果。</text><text x="32" y="1040" font-size="14" fill="#20394e" xml:space="preserve"></text><text x="32" y="1062" font-size="14" fill="#20394e" xml:space="preserve">人工确认：未提供标记</text><text x="32" y="1084" font-size="14" fill="#20394e" xml:space="preserve">限制</text><text x="32" y="1106" font-size="14" fill="#20394e" xml:space="preserve">评估仅表示输入满足既定规则，不表示科学正确性已验证。</text><text x="32" y="1128" font-size="14" fill="#20394e" xml:space="preserve">用于验证页面，不代表真实论文结论。</text><text x="32" y="1150" font-size="14" fill="#20394e" xml:space="preserve">本结果只用于界面开发。</text></svg>